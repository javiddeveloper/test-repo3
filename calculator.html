<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماشین حساب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calculator {
            width: 350px;
            background: #1c1c1e;
            border-radius: 30px;
            padding: 25px 20px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .display {
            background: #0a0a0b;
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 25px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            direction: ltr;
        }

        .display-text {
            color: #ffffff;
            font-size: 42px;
            font-weight: 300;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            letter-spacing: 1px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .btn {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            font-weight: 500;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            outline: none;
        }

        .btn:active {
            transform: scale(0.92);
        }

        /* رنگ‌ها */
        .btn-number {
            background: #3a3a3c;
            color: #ffffff;
        }
        .btn-number:hover {
            background: #4a4a4c;
        }

        .btn-operator {
            background: #ff9f0c;
            color: #ffffff;
        }
        .btn-operator:hover {
            background: #ffb13d;
        }

        .btn-function {
            background: #5c5c5e;
            color: #ffffff;
        }
        .btn-function:hover {
            background: #6c6c6e;
        }

        .btn-equals {
            background: #ff9f0c;
            color: #ffffff;
        }
        .btn-equals:hover {
            background: #ffb13d;
        }

        /* دکمه‌های با عرض بیشتر */
        .btn-wide {
            grid-column: span 2;
            border-radius: 50px;
            aspect-ratio: auto;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="display-text" id="display">0</div>
        </div>
        <div class="buttons" id="buttonsContainer">
            <!-- ردیف اول: 0, AC, √x, %, ÷ (5 ستون) -->
            <button class="btn btn-number" data-value="0">0</button>
            <button class="btn btn-function" data-value="AC">AC</button>
            <button class="btn btn-function" data-value="√">√x</button>
            <button class="btn btn-function" data-value="%">%</button>
            <button class="btn btn-operator" data-value="÷">÷</button>

            <!-- ردیف دوم: 7, 8, 9, × (ستون ۵ خالی) -->
            <button class="btn btn-number" data-value="7">7</button>
            <button class="btn btn-number" data-value="8">8</button>
            <button class="btn btn-number" data-value="9">9</button>
            <button class="btn btn-operator" data-value="×">×</button>
            <div></div> <!-- سلول خالی -->

            <!-- ردیف سوم: 4, 5, 6, − -->
            <button class="btn btn-number" data-value="4">4</button>
            <button class="btn btn-number" data-value="5">5</button>
            <button class="btn btn-number" data-value="6">6</button>
            <button class="btn btn-operator" data-value="−">−</button>
            <div></div>

            <!-- ردیف چهارم: 1, 2, 3, + -->
            <button class="btn btn-number" data-value="1">1</button>
            <button class="btn btn-number" data-value="2">2</button>
            <button class="btn btn-number" data-value="3">3</button>
            <button class="btn btn-operator" data-value="+">+</button>
            <div></div>

            <!-- ردیف پنجم: 0 (دو عرض), ., = -->
            <button class="btn btn-number btn-wide" data-value="0">0</button>
            <button class="btn btn-number" data-value=".">.</button>
            <button class="btn btn-equals btn-wide" data-value="=">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        let currentInput = '0';
        let previousInput = '';
        let operation = null;
        let shouldResetDisplay = false;

        function updateDisplay() {
            display.textContent = currentInput;
        }

        function handleNumber(num) {
            if (shouldResetDisplay) {
                currentInput = num;
                shouldResetDisplay = false;
            } else {
                if (currentInput === '0' && num !== '.') {
                    currentInput = num;
                } else {
                    if (num === '.' && currentInput.includes('.')) return;
                    currentInput += num;
                }
            }
            updateDisplay();
        }

        function handleOperator(op) {
            if (operation && !shouldResetDisplay) {
                calculate();
            }
            previousInput = currentInput;
            operation = op;
            shouldResetDisplay = true;
        }

        function calculate() {
            let result;
            const prev = parseFloat(previousInput);
            const curr = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(curr)) return;

            switch (operation) {
                case '+': result = prev + curr; break;
                case '−': result = prev - curr; break;
                case '×': result = prev * curr; break;
                case '÷':
                    if (curr === 0) {
                        currentInput = 'Error';
                        updateDisplay();
                        return;
                    }
                    result = prev / curr;
                    break;
                default: return;
            }

            currentInput = String(result);
            operation = null;
            previousInput = '';
            shouldResetDisplay = true;
            updateDisplay();
        }

        function handleFunction(func) {
            switch (func) {
                case 'AC':
                    currentInput = '0';
                    previousInput = '';
                    operation = null;
                    shouldResetDisplay = false;
                    updateDisplay();
                    break;
                case '√':
                    const num = parseFloat(currentInput);
                    if (num < 0) {
                        currentInput = 'Error';
                    } else {
                        currentInput = String(Math.sqrt(num));
                    }
                    shouldResetDisplay = true;
                    updateDisplay();
                    break;
                case '%':
                    currentInput = String(parseFloat(currentInput) / 100);
                    shouldResetDisplay = true;
                    updateDisplay();
                    break;
            }
        }

        function handleEquals() {
            if (!operation) return;
            calculate();
            updateDisplay();
        }

        // رویداد کلیک
        document.getElementById('buttonsContainer').addEventListener('click', (e) => {
            const btn = e.target.closest('.btn');
            if (!btn) return;

            const value = btn.dataset.value;

            if (btn.classList.contains('btn-number')) {
                handleNumber(value);
            } else if (btn.classList.contains('btn-operator')) {
                handleOperator(value);
            } else if (btn.classList.contains('btn-equals')) {
                handleEquals();
            } else if (btn.classList.contains('btn-function')) {
                handleFunction(value);
            }
        });
    </script>
</body>
</html>
