<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتخاب استان و شهر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=General+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container" role="application" aria-label="انتخابگر استان و شهر">
        <h1 class="container__title">انتخاب استان و شهر</h1>

        <div class="form-group">
            <label for="province" class="form-label">استان</label>
            <select id="province" class="select" aria-label="انتخاب استان">
                <option value="">— استان را انتخاب کنید —</option>
            </select>
        </div>

        <div class="form-group">
            <label for="city" class="form-label">شهر</label>
            <select id="city" class="select" aria-label="انتخاب شهر">
                <option value="">— ابتدا استان را انتخاب کنید —</option>
            </select>
        </div>

        <div class="actions">
            <button id="resetBtn" class="btn btn--secondary" aria-label="پاک کردن انتخاب‌ها">AC</button>
        </div>

        <div id="result" class="result" role="status" aria-live="polite" aria-atomic="true">
            هیچ استانی انتخاب نشده است.
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
